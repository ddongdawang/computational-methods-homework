name: Build LaTeX PDF

on:
  push:
    branches: [main]
    paths:
      - '**/*.tex'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install TeX Live (XeLaTeX + Chinese)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-xetex \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-lang-chinese \
            latexmk

      - name: Compile all .tex files
        run: |
          for f in *.tex; do
            echo "==> Compiling $f"
            latexmk -xelatex -interaction=nonstopmode -halt-on-error "$f"
          done

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: latex-pdf
          path: '*.pdf'
          if-no-files-found: error
